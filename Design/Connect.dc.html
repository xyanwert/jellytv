<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&display=swap">
  <style>
    body { margin: 0; background: #07080C; color: #F4F5F7;
           font-family: 'Schibsted Grotesk', ui-rounded, system-ui, sans-serif;
           -webkit-font-smoothing: antialiased; }
    a { color: #B14EFF; } a:hover { color: #c887ff; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .field { display: flex; align-items: center; height: 46px; padding: 0 14px; border-radius: 11px;
             background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
             font-size: 15px; font-weight: 500; color: rgba(255,255,255,0.35); }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #07080C">

  <div style="position: absolute; inset: 0; background:
      radial-gradient(120% 62% at 82% 4%, #241338 0%, #150b22 38%, #0a0710 72%, #07080C 100%)"></div>
  <svg viewBox="0 0 390 844" style="position: absolute; inset: 0; width: 390px; height: 844px" fill="none">
    <g stroke="#B14EFF" stroke-width="1">
      <circle cx="332" cy="66" r="58" opacity="0.2"></circle>
      <circle cx="332" cy="66" r="126" opacity="0.12"></circle>
      <circle cx="332" cy="66" r="206" opacity="0.06"></circle>
    </g>
  </svg>

  <!-- BRAND — one compact row. The iPad's 440pt column and 46pt headline
       don't survive a phone; the mark and the wordmark do. -->
  <div style="position: absolute; top: 58px; left: 20px; right: 20px; display: flex; align-items: center; gap: 14px">
    <div style="position: relative; width: 56px; height: 56px; border-radius: 16px; overflow: hidden;
        background: linear-gradient(150deg, #7b2fd0, #4a1b7d); border: 1px solid rgba(255,255,255,0.1);
        box-shadow: 0 8px 22px rgba(0,0,0,0.55)">
      <svg viewBox="0 0 56 56" style="position: absolute; inset: 0; width: 56px; height: 56px" fill="none">
        <g stroke="#F4F5F7" stroke-width="1.6" opacity="0.85">
          <circle cx="28" cy="30" r="7"></circle><circle cx="28" cy="30" r="15" opacity="0.5"></circle></g>
        <circle cx="28" cy="30" r="2.6" fill="#F4F5F7"></circle></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 24px; font-weight: 900; letter-spacing: -0.8px">
        Why<span style="color: #B14EFF">.</span>So<span style="color: #B14EFF">.</span>Jelly?</div>
      <span class="mono" style="font-size: 10px; font-weight: 700; letter-spacing: 3px;
          color: rgba(255,255,255,0.42)">JELLYFIN CLIENT</span>
    </div>
  </div>

  <div style="position: absolute; top: 134px; left: 20px; right: 20px; font-size: 26px; font-weight: 900;
      letter-spacing: -0.9px">Connect your server</div>

  <div style="position: absolute; top: 176px; left: 20px; right: 20px; display: flex; align-items: center; gap: 10px">
    <div style="width: 9px; height: 9px; border-radius: 999px; background: #E8B44A;
        box-shadow: 0 0 8px rgba(232,180,74,0.85)"></div>
    <span class="mono" style="font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
        color: rgba(232,180,74,0.85)">AWAITING CREDENTIALS</span>
  </div>

  <!-- HOST — discovery first: the found server is the answer, typing is the fallback. -->
  <div style="position: absolute; top: 216px; left: 20px; right: 20px; display: flex; align-items: center; gap: 10px">
    <span class="mono" style="font-size: 12px; font-weight: 800; letter-spacing: 2px;
        color: rgba(255,255,255,0.5)">HOST</span>
    <span class="mono" style="font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.3)">192.168.1.x</span>
    <div style="flex-grow: 1"></div>
    <div style="display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 999px;
        background: rgba(177,78,255,0.12); border: 1px solid rgba(177,78,255,0.35)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#B14EFF" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 11.5 A 8 8 0 1 1 17.4 6"></path><path d="M20 4.5 L20 10 L14.5 10"></path></svg>
      <span style="font-size: 13px; font-weight: 800; color: #B14EFF">Rescan</span>
    </div>
  </div>

  <div style="position: absolute; top: 258px; left: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 14px; height: 64px; padding: 0 16px; border-radius: 14px;
        background: rgba(177,78,255,0.1); border: 1.5px solid rgba(177,78,255,0.5)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#B14EFF">
        <path d="M12 2.4 A 9.6 9.6 0 1 0 12 21.6 A 9.6 9.6 0 0 0 12 2.4 Z M10.8 16.2 L6.8 12.2 L8.5 10.5
                 L10.8 12.8 L15.5 8.1 L17.2 9.8 Z"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <span style="font-size: 17px; font-weight: 800">reef.local</span>
        <span class="mono" style="font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.5)">192.168.1.150:8096</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; height: 64px; padding: 0 16px; border-radius: 14px;
        background: rgba(255,255,255,0.04); border: 1.5px solid rgba(255,255,255,0.1)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="6.4" rx="1.8"></rect>
        <rect x="3" y="13.6" width="18" height="6.4" rx="1.8"></rect>
        <path d="M6.6 7.2 L6.7 7.2 M6.6 16.8 L6.7 16.8"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <span style="font-size: 17px; font-weight: 700; color: rgba(255,255,255,0.9)">basement-nas</span>
        <span class="mono" style="font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.5)">192.168.1.42:8096</span>
      </div>
    </div>
  </div>

  <div style="position: absolute; top: 406px; left: 20px; right: 20px; display: flex; align-items: center; gap: 12px">
    <span style="font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.45)">Not listed?</span>
    <div style="display: flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 999px;
        background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.14)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="6" width="19" height="12" rx="2.4"></rect>
        <path d="M6.5 10 L6.6 10 M10 10 L10.1 10 M13.5 10 L13.6 10 M17.5 10 L17.6 10 M8 14 L16 14"></path></svg>
      <span style="font-size: 13px; font-weight: 800; color: rgba(255,255,255,0.6)">Enter it manually</span>
    </div>
  </div>

  <!-- SIGN IN — the default path, open. -->
  <div style="position: absolute; top: 458px; left: 20px; right: 20px; padding: 18px; border-radius: 16px;
      background: rgba(255,255,255,0.03); border: 1.5px solid rgba(255,255,255,0.1)">
    <div style="display: flex; align-items: center; margin-bottom: 13px">
      <span class="mono" style="font-size: 12px; font-weight: 800; letter-spacing: 2px;
          color: rgba(255,255,255,0.62)">SIGN IN</span>
      <div style="flex-grow: 1"></div>
      <span class="mono" style="font-size: 10px; font-weight: 700; letter-spacing: 1.2px;
          color: rgba(255,255,255,0.4)">OPTIONAL</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div class="field">Username</div>
      <div class="field">Password</div>
    </div>
  </div>

  <!-- API KEY — collapsed to one row on phone. It is the minority path, and a
       second open box costs the Connect button its place on the screen. -->
  <div style="position: absolute; top: 644px; left: 20px; right: 20px; display: flex; align-items: center; gap: 12px;
      height: 48px; padding: 0 16px; border-radius: 13px; background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1)">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.9"
         stroke-linecap="round" stroke-linejoin="round">
      <circle cx="8" cy="12" r="4.2"></circle><path d="M12.2 12 L21 12 M18 12 L18 15.4 M15 12 L15 14.4"></path></svg>
    <span style="font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.62)">Use an API key instead</span>
    <div style="flex-grow: 1"></div>
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round"><path d="M9 5 L16 12 L9 19"></path></svg>
  </div>

  <!-- CONNECT — on screen without scrolling, which is the point of collapsing the box above. -->
  <div style="position: absolute; top: 708px; left: 20px; right: 20px; display: flex; align-items: center;
      justify-content: center; gap: 12px; height: 62px; border-radius: 16px; background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1)">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2.6"
         stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 L20 12 M13 5 L20 12 L13 19"></path></svg>
    <span style="font-size: 19px; font-weight: 900; color: rgba(255,255,255,0.4)">Connect</span>
  </div>

  <div style="position: absolute; top: 784px; left: 20px; right: 20px; text-align: center; font-size: 13px;
      font-weight: 500; color: rgba(255,255,255,0.35)">Enter a username &amp; password, or an API key.</div>

</div>
</x-dc>
</body>
</html>
