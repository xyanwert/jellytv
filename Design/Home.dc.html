<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&display=swap">
  <style>
    body { margin: 0; background: #07080C; color: #F4F5F7;
           font-family: 'Schibsted Grotesk', ui-rounded, system-ui, sans-serif;
           -webkit-font-smoothing: antialiased; }
    a { color: #F0525F; } a:hover { color: #ff7a83; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .shelf { font-size: 19px; font-weight: 800; letter-spacing: -0.2px; }
    .pill { display: flex; align-items: center; gap: 7px; height: 38px; padding: 0 16px; border-radius: 999px;
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
            font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.82); white-space: nowrap; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #07080C">

  <!-- HEADER — a title, not a banner. The art belongs to the cards. -->
  <div style="position: absolute; top: 58px; left: 20px; right: 20px; display: flex; align-items: center; gap: 12px">
    <span style="font-size: 30px; font-weight: 900; letter-spacing: -0.9px">Home</span>
    <div style="flex-grow: 1"></div>
    <div style="display: grid; place-items: center; width: 34px; height: 34px; border-radius: 999px;
        background: linear-gradient(140deg, #7b2f57, #b13a4e); border: 2px solid #FFF3F3;
        font-size: 14px; font-weight: 800; color: #fff">M</div>
  </div>

  <!-- LIBRARY PILLS — every library one tap from Home, instead of buried in More. -->
  <div style="position: absolute; top: 108px; left: 0; right: 0; display: flex; align-items: center; gap: 9px;
      padding-left: 20px">
    <div class="pill" style="background: {{accent}}; border-color: transparent; color: #fff;
        box-shadow: 0 6px 16px {{accentGlow}}">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3 L14.6 9.1 L21 9.7 L16.2 14 L17.6 20.4 L12 17 L6.4 20.4 L7.8 14 L3 9.7 L9.4 9.1 Z"></path></svg>
      For You</div>
    <div class="pill">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3"></rect>
        <path d="M7.5 3 L7.5 21 M16.5 3 L16.5 21 M3 8 L7.5 8 M3 16 L7.5 16 M16.5 8 L21 8 M16.5 16 L21 16"></path></svg>
      Movies</div>
    <div class="pill">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="6" width="19" height="12.5" rx="2.5"></rect><path d="M8 2.5 L12 6 L16 2.5"></path></svg>
      Shows</div>
    <div class="pill">Anime</div>
  </div>

  <!-- FEATURED — a card, with its neighbours peeking. Contained art, so the
       screen keeps its top for navigation. -->
  <div style="position: absolute; top: 164px; left: 0; right: 0; height: 384px">
    <div style="position: absolute; left: 6px; top: 16px; width: 26px; height: 352px; border-radius: 16px;
        background: linear-gradient(160deg, #4a2a63, #1b1029); opacity: 0.55"></div>
    <div style="position: absolute; right: 6px; top: 16px; width: 26px; height: 352px; border-radius: 16px;
        background: linear-gradient(160deg, #1f5a52, #0a201c); opacity: 0.55"></div>

    <div style="position: absolute; left: 44px; width: 302px; height: 384px; border-radius: 18px; overflow: hidden;
        border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 18px 40px rgba(0,0,0,0.55)">
      <div style="position: absolute; inset: 0; background:
          radial-gradient(120% 70% at 68% 22%, #1d5570 0%, #123246 42%, #08131f 78%, #050a10 100%)"></div>
      <svg viewBox="0 0 302 384" style="position: absolute; inset: 0; width: 302px; height: 384px" fill="none">
        <g stroke="#78B4DC" stroke-width="1">
          <circle cx="206" cy="104" r="38" opacity="0.24"></circle>
          <circle cx="206" cy="104" r="86" opacity="0.15"></circle>
          <circle cx="206" cy="104" r="146" opacity="0.08"></circle>
        </g>
        <path d="M206 104 L206 58 M206 104 L252 104" stroke="#F0525F" stroke-width="1.4" opacity="0.55"></path>
        <path d="M0 214 C 70 190, 130 232, 190 208 S 272 176, 302 192 L302 384 L0 384 Z"
              fill="#040a12" opacity="0.62"></path>
      </svg>
      <div style="position: absolute; inset: 0; background:
          linear-gradient(to bottom, transparent 34%, rgba(3,6,11,0.72) 68%, #03060B 100%)"></div>

      <div style="position: absolute; left: 0; right: 0; bottom: 22px; display: flex; flex-direction: column;
          align-items: center; gap: 10px; padding: 0 18px">
        <span class="mono" style="font-size: 10px; font-weight: 800; letter-spacing: 1.6px; color: #0B0D13;
            background: #F4F5F7; border-radius: 999px; padding: 5px 11px">NEW SEASON</span>
        <span style="font-size: 27px; font-weight: 900; letter-spacing: -0.8px; text-align: center; line-height: 1.04;
            text-shadow: 0 3px 18px rgba(0,0,0,0.6)">The Deep Signal</span>
        <span style="font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.72)">Season 3 · 8 new episodes</span>
        <div style="display: flex; align-items: center; gap: 8px">
          <span class="mono" style="font-size: 9px; font-weight: 700; color: rgba(255,255,255,0.8);
              border: 1px solid rgba(255,255,255,0.28); border-radius: 4px; padding: 2px 5px">TV-MA</span>
          <span style="font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.55)">2026 · Sci-Fi Drama</span>
        </div>
      </div>
    </div>
  </div>

  <!-- CONTINUE WATCHING -->
  <div style="position: absolute; top: 572px; left: 0; right: 0">
    <div style="padding: 0 20px 11px"><span class="shelf">Continue Watching</span></div>
    <div style="display: flex; gap: 12px; padding: 0 20px">

      <div style="flex-shrink: 0; width: 206px">
        <div style="position: relative; height: 116px; border-radius: 13px; overflow: hidden;
            border: 2px solid #2f7f9e; box-shadow: 0 8px 20px rgba(0,0,0,0.45)">
          <div style="position: absolute; inset: 0; background: linear-gradient(150deg, #1b5b74 0%, #0f3448 56%, #081d2b 100%)"></div>
          <svg viewBox="0 0 206 116" style="position: absolute; inset: 0; width: 206px; height: 116px" fill="none">
            <g stroke="#8fd0e8" stroke-width="1" opacity="0.3">
              <circle cx="158" cy="32" r="20"></circle><circle cx="158" cy="32" r="42"></circle></g></svg>
          <div style="position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 48%, rgba(0,0,0,0.62))"></div>
          <div style="position: absolute; left: 11px; bottom: 13px; font-size: 14px; font-weight: 800;
              text-shadow: 0 2px 10px rgba(0,0,0,0.6)">The Deep Signal</div>
          <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,0.18)">
            <div style="width: 62%; height: 4px; background: {{accent}}"></div></div>
        </div>
        <div style="padding-top: 7px; display: flex; align-items: baseline; gap: 7px">
          <span style="font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.5)">S3 · E4 — Trench</span>
          <span class="mono" style="font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.32)">31:04</span>
        </div>
      </div>

      <div style="flex-shrink: 0; width: 206px">
        <div style="position: relative; height: 116px; border-radius: 13px; overflow: hidden;
            border: 2px solid #a2703a; box-shadow: 0 8px 20px rgba(0,0,0,0.45)">
          <div style="position: absolute; inset: 0; background: linear-gradient(150deg, #8a5a2c 0%, #4d3018 58%, #241508 100%)"></div>
          <svg viewBox="0 0 206 116" style="position: absolute; inset: 0; width: 206px; height: 116px" fill="none">
            <path d="M0 90 L50 58 L98 86 L144 48 L206 78 L206 116 L0 116 Z" fill="#1c1006" opacity="0.6"></path></svg>
          <div style="position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 48%, rgba(0,0,0,0.62))"></div>
          <div style="position: absolute; left: 11px; bottom: 13px; font-size: 14px; font-weight: 800;
              text-shadow: 0 2px 10px rgba(0,0,0,0.6)">Copper Season</div>
          <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,0.18)">
            <div style="width: 24%; height: 4px; background: {{accent}}"></div></div>
        </div>
        <div style="padding-top: 7px; display: flex; align-items: baseline; gap: 7px">
          <span style="font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.5)">S1 · E7 — Harvest</span>
          <span class="mono" style="font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.32)">40:12</span>
        </div>
      </div>

      <div style="flex-shrink: 0; width: 56px">
        <div style="height: 116px; border-radius: 13px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08)"></div>
      </div>
    </div>
  </div>

  <!-- RECOMMENDED — runs under the bar, which is what says the page scrolls. -->
  <div style="position: absolute; top: 762px; left: 0; right: 0">
    <div style="padding: 0 20px 11px"><span class="shelf">Recommended for You</span></div>
    <div style="display: flex; gap: 12px; padding: 0 20px">
      <div style="flex-shrink: 0; width: 104px; height: 154px; border-radius: 13px;
          background: linear-gradient(160deg, #4a2a63 0%, #26173a 60%, #140c20 100%);
          border: 1px solid rgba(255,255,255,0.08)"></div>
      <div style="flex-shrink: 0; width: 104px; height: 154px; border-radius: 13px;
          background: linear-gradient(160deg, #1f5a52 0%, #12352f 60%, #08201c 100%);
          border: 1px solid rgba(255,255,255,0.08)"></div>
      <div style="flex-shrink: 0; width: 104px; height: 154px; border-radius: 13px;
          background: linear-gradient(160deg, #6b3340 0%, #3a1c26 60%, #1e0e14 100%);
          border: 1px solid rgba(255,255,255,0.08)"></div>
    </div>
  </div>

  <!-- TAB BAR — floats on a fade rather than a hard edge, so art can pass under it. -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 96px;
      background: linear-gradient(to bottom, rgba(7,8,12,0) 0%, rgba(7,8,12,0.86) 32%, #07080C 100%)"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 74px; display: flex;
      align-items: flex-start; padding-top: 10px">

    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5 L12 3 L21 10.5"></path><path d="M5 9.5 L5 21 L19 21 L19 9.5"></path></svg>
      <span style="font-size: 11px; font-weight: 700; color: {{accent}}">Home</span>
    </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3"></rect>
        <path d="M7.5 3 L7.5 21 M16.5 3 L16.5 21 M3 8 L7.5 8 M3 16 L7.5 16 M16.5 8 L21 8 M16.5 16 L21 16"></path></svg>
      <span style="font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.5)">Movies</span>
    </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="6" width="19" height="12.5" rx="2.5"></rect><path d="M8 2.5 L12 6 L16 2.5"></path></svg>
      <span style="font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.5)">Shows</span>
    </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle><path d="M16.5 16.5 L20 20"></path></svg>
      <span style="font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.5)">Search</span>
    </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7.5" height="7.5" rx="1.6"></rect>
        <rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"></rect>
        <rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"></rect>
        <path d="M17.25 14.25 L17.25 20.25 M14.25 17.25 L20.25 17.25"></path></svg>
      <span style="font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.5)">More</span>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#F0525F","options":["#F0525F","#E8B44A","#4AA8E8","#3FBF8F"],"section":"Theme"}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#F0525F';
    const rgba = (hex, a) => {
      const n = parseInt(String(hex).replace('#', ''), 16);
      return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    };
    return { accent: accent, accentGlow: rgba(accent, 0.42) };
  }
}
</script>
</body>
</html>
