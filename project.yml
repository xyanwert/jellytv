name: JellyTV

options:
  bundleIdPrefix: net.graficx
  createIntermediateGroups: true
  deploymentTarget:
    tvOS: "17.0"
    iOS: "17.0"
  groupSortPosition: top

# Shared across every target. Version numbers live here ONCE so the tvOS app and
# its iOS companion can never drift apart (required for universal purchase).
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: "44RDME8NMM"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR

packages:
  JellyTVKit:
    path: Packages/JellyTVKit

targets:
  # ---------------- tvOS app ----------------
  JellyTV:
    type: application
    platform: tvOS
    sources:
      - path: Apps/Core/Sources
      - path: Apps/JellyTV/Sources
      - path: Apps/JellyTV/Resources
    dependencies:
      - package: JellyTVKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.graficx.jellytv
        PRODUCT_NAME: JellyTV
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Apps/JellyTV/Support/Info.plist
      properties:
        CFBundleDisplayName: "Why.So.Jelly?"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        UIAppFonts:
          - SchibstedGrotesk.ttf
        # Local-network discovery of Jellyfin servers (unicast /24 sweep).
        NSLocalNetworkUsageDescription: "Why.So.Jelly? scans your local network to find your Jellyfin server automatically."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  # ---------------- iPadOS companion (standalone client) ----------------
  Remote:
    type: application
    platform: iOS
    sources:
      - path: Apps/Core/Sources
      - path: Apps/Remote/Sources
      - path: Apps/Remote/Resources
      # Shares the tvOS target's font file rather than duplicating it — see
      # the `UIAppFonts` note below.
      - path: Apps/JellyTV/Resources/Fonts
      # The hero crumble/heat-haze transition (`HeroTransitions.swift`) is
      # shared code, but its Metal shaders live in one file that was only
      # ever added to the tvOS target — without it here too, `ShaderLibrary`
      # can't resolve `hexCrumble`/`heatHaze` on iOS, and a `.layerEffect`
      # with an unresolvable shader silently renders its content invisible
      # (not just untransformed) — that's the "no backdrop image at all"
      # bug this fixes, not an image-loading problem.
      - path: Apps/JellyTV/Resources/HeroTransitions.metal
    dependencies:
      - package: JellyTVKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.graficx.jellytv
        PRODUCT_NAME: JellyTV
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Apps/Remote/Support/Info.plist
      properties:
        CFBundleDisplayName: "Why.So.Jelly?"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIColorName: ""
        # Without this, `Typography`'s custom-font lookup never resolves on
        # iOS (the font file was only ever registered for the tvOS target),
        # silently falling back to the system font everywhere.
        UIAppFonts:
          - SchibstedGrotesk.ttf
        # Opts out of iPad's resizable/multitasking window presentation —
        # without this, a landscape-only app can get windowed/letterboxed at
        # an arbitrary (even portrait-ish) size instead of taking over the
        # full landscape screen.
        UIRequiresFullScreen: true
        # A standalone Jellyfin client for iPad — browses the library and plays
        # video itself. Local-network access is only for the (later) "connect
        # with code" pairing shortcut that hands over an already-configured
        # server's connection details; it does not control the TV app.
        NSLocalNetworkUsageDescription: "Why.So.Jelly? can pick up your Apple TV app's server connection over your local network so you don't have to enter it twice."
        NSBonjourServices:
          - _jellytv._tcp
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

schemes:
  JellyTV:
    build:
      targets:
        JellyTV: all
    run:
      config: Debug
    archive:
      config: Release
  Remote:
    build:
      targets:
        Remote: all
    run:
      config: Debug
    archive:
      config: Release
